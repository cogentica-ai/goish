name: provenance

# Per-push gate on the provenance claim itself.
#
# The README tells buyers that every ported function names the Go source
# file and line range it came from, and that the claim is machine-checked
# rather than asserted. This is the job that makes that true in public:
# it fetches the real Go 1.25.5 tree and re-opens every anchor against it.
#
# What this gate covers:
#
#   anchor_check.py   every `// go: sdk 1.25.5 <file>:<lines> <Symbol>`
#                     anchor cites a file that exists in the Go tree and a
#                     line range that still resolves to the symbol named.
#                     Ranges rot silently when upstream moves code — 229 of
#                     1802 were wrong the first time this was measured.
#
#   port_coverage.py  crypto/ is still 1709/1709 declarations. A regression
#                     here means a decl was dropped or renamed out of the
#                     port, which no test would notice.
#
# What it does NOT cover: goishlint's GOISH018 signature/arity/struct-field
# diff (`make lint`). That linter is a separate binary and is not in this
# repo, so it remains a local, pre-commit ratchet. The README says so
# explicitly — do not let this workflow's green badge be described as
# covering the full fidelity tier, because it does not.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Both scripts resolve anchors against $GOROOT. The version is pinned
      # to the one the anchors name: checking 1.25.5 anchors against a
      # different Go tree would produce noise, not signal.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Export GOROOT
        run: echo "GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: Anchors resolve against the Go 1.25.5 tree
        run: python3 scripts/anchor_check.py src

      # crypto/ is held to the stricter rules: every `// go: sdk` line is a
      # well-formed anchor naming 1.25.5, and each one resolves to exactly
      # its declaration (boundaries from go/parser). Exit 2 means the check
      # could not decide (no 1.25.5 tree, missing scope, no anchors, helper
      # did not build); it fails the job, but is not a citation breach.
      - name: crypto/ anchors are well formed and resolve
        run: |
          for rule in form resolve; do
            rc=0
            python3 scripts/anchor_check.py --rule "$rule" src/crypto || rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "::error::anchor_check --rule $rule could not decide (see above); this is not a citation breach"
            fi
            [ "$rc" -eq 0 ] || exit "$rc"
          done

      - name: crypto/ is still 100% by declaration
        run: |
          set -o pipefail
          python3 scripts/port_coverage.py crypto --by-decl | tee /tmp/cov.txt
          # Assert the PROPERTY (every declaration ported), not a frozen
          # count. The literal `1709/1709` broke the moment port_coverage
          # learned to parse a generic receiver — `func (h *mapping[K, V])
          # add` had matched nothing, so 13 crypto declarations were
          # missing from the denominator entirely. Coverage stayed 100.0%
          # and the gate failed anyway, which is the gate reporting on
          # its own arithmetic rather than on the tree.
          #
          # The floor still catches a real regression: a decl that stops
          # being counted, or a Go file that stops being scanned, drops
          # the total below it.
          python3 - <<'EOF'
          import re, sys
          line = [l for l in open('/tmp/cov.txt') if l.startswith('TOTAL ')][-1]
          m = re.search(r'TOTAL (\d+)/(\d+) funcs = ([\d.]+)%', line)
          if not m:
              sys.exit(f'provenance: cannot parse coverage TOTAL line: {line!r}')
          have, want, pct = int(m.group(1)), int(m.group(2)), float(m.group(3))
          if have != want or pct != 100.0:
              sys.exit(f'provenance: crypto/ is {have}/{want} = {pct}%, not 100%')
          if want < 1709:
              sys.exit(f'provenance: crypto/ denominator fell to {want} (floor 1709) '
                       '- declarations stopped being counted')
          print(f'provenance: crypto/ {have}/{want} = {pct}% (floor 1709)')
          EOF
