name: e2e

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      # Tiered loop counts (functional=1, memory=10, races/stress=50).
      # CI runners are slower than the dev box, so widen the
      # per-iteration timeout; https_real_smoke already tolerates
      # network flakes via the runner's NETWORK_FLAKY handling.
      - name: make e2e
        run: make e2e TIMEOUT=30

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: scripts/.e2e-artifacts
          if-no-files-found: ignore
