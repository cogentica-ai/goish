[workspace]
members = ["goish-macros"]
resolver = "2"

[package]
name = "goish"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
authors = ["Chanwit Kaewkasi <chanwit@gmail.com>"]
description = "Goish v1 — Go-style stdlib for Rust, no_std and no glibc, built on raw Linux syscalls."
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
goish-macros = { path = "goish-macros", version = "0.1" }
libm = { version = "0.2", default-features = false }

[profile.dev]
panic = "abort"
# Full embedded DWARF for gdb post-mortem on e2e segfaults +
# rr replay. `debug = "full"` is equivalent to `debug = 2`; making
# it explicit guards against future global rust default changes.
debug = "full"
split-debuginfo = "off"
strip = "none"

[profile.release]
panic = "abort"
lto = true
strip = true
codegen-units = 1

# `cargo build --release --profile=rrdbg` for an rr-friendly build:
# release optimizations + full debug info, no LTO (so symbols survive),
# no strip. Trace size grows, but rr replay shows source-level frames.
[profile.rrdbg]
inherits = "release"
debug = "full"
strip = false
lto = false

