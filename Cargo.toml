[workspace]
members = ["goish-macros"]
resolver = "2"

[package]
name = "goish"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Chanwit Kaewkasi <chanwit@gmail.com>"]
description = "Goish v1 — Go-style stdlib for Rust, no_std and no glibc, built on raw Linux syscalls."
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
goish-macros = { path = "goish-macros", version = "0.1" }
# dlmalloc-rs: leaf allocator. Pure Rust port of Doug Lea's malloc, used
# by Rust itself for the wasm target. We supply our own mmap-backed
# Allocator impl so it never touches libc.
dlmalloc = { version = "0.2", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
strip = true
codegen-units = 1

[[example]]
name = "hello"
path = "examples/hello.rs"

[[example]]
name = "alloc_smoke"
path = "examples/alloc_smoke.rs"

[[example]]
name = "strings"
path = "examples/strings.rs"

[[example]]
name = "slices"
path = "examples/slices.rs"

[[example]]
name = "errors"
path = "examples/errors.rs"

[[example]]
name = "greet_m9"
path = "examples/greet_m9.rs"
